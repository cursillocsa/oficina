<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina · Gauss</title>
<style>
:root{--rojo:#c0392b;--negro:#201e1e;--fondo:#f3f5f9;--verde:#1b8a3a;--azul:#1f4e79}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:#222;font-size:16px}
header{background:var(--negro);color:#fff;padding:14px 16px;border-bottom:4px solid var(--rojo);display:flex;align-items:center;gap:12px}
header h1{margin:0;font-size:20px;flex:1}header h1 span{color:#ff6b5e}
#volver{display:none;background:#444;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer}
main{padding:14px 16px 70px;max-width:820px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card h2{margin:0 0 10px;font-size:17px;color:var(--azul)}
.botones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bgrande{display:block;text-align:left;border:0;border-radius:14px;padding:18px;font-size:19px;font-weight:bold;cursor:pointer;color:#fff;text-decoration:none;min-height:96px}
.bgrande small{display:block;font-weight:normal;font-size:13px;opacity:.9;margin-top:6px}
.b1{background:var(--azul)}.b2{background:var(--rojo)}.bx{background:#9e9e9e;cursor:default}
label{display:block;font-weight:bold;margin-top:12px;font-size:14px}
label .req{color:var(--rojo)}
input,select,textarea{width:100%;font-size:17px;padding:10px;border:1px solid #bbb;border-radius:8px;margin-top:4px;background:#fff;font-family:inherit}
input[type=checkbox]{width:auto;transform:scale(1.4);margin-right:8px}
.fila{display:flex;gap:12px}.fila>div{flex:1;min-width:0}
@media(max-width:600px){.fila{flex-direction:column;gap:0}}
.btn{display:block;width:100%;font-size:18px;padding:14px;background:var(--rojo);color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:bold;margin-top:16px}
.btn:disabled{opacity:.6}.btn.az{background:var(--azul)}.btn.gr{background:#666}.btn.vd{background:#25d366}
.ayuda{color:#777;font-size:13px;font-weight:normal}
.err{color:var(--rojo);font-weight:bold;margin-top:10px}
.res div{padding:11px 12px;border:1px solid #eee;border-radius:8px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.res small{color:#777}
.mini{font-size:14px;padding:8px 12px;border:0;border-radius:8px;background:var(--azul);color:#fff;cursor:pointer;white-space:nowrap}
.aviso{background:#fff2cc;border-radius:8px;padding:10px;margin-top:10px;font-size:14px}
.ok{background:#d9ead3;border-radius:12px;padding:16px}
.ok b.big{font-size:20px;display:block;margin-bottom:6px}
#msg{color:#666;text-align:center;margin-top:30px}
.paso{display:inline-block;background:var(--azul);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-right:6px;font-size:14px}
</style></head><body>
<header><h1>🏫 Oficina <span>Gauss</span></h1><button id="volver" onclick="inicio()">⬅ Inicio</button></header>
<main><div id="app"></div><div id="msg">Cargando…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbzPNqOlPMgP1lme__szBCxU4kzz7fSJ3PxLxUZu_CcywI5ftsESe6e7hL63z1Xp7M6U/exec';
var PANEL_COBRO='https://cursillocsa.github.io/secretaria/';
var PIN='';try{PIN=localStorage.getItem('gaussPinSec')||'';}catch(e){}
var L=null,FORM=null,EST={};
function el(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sa(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');}
function gs(n){n=Number(n)||0;return 'Gs. '+Math.round(n).toLocaleString('es-PY');}
function num(s){return Number(String(s).replace(/[^0-9]/g,''))||0;}
function fmt(i){var n=num(i.value);i.value=n?n.toLocaleString('es-PY'):'';}
function fecha(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function guardado(k,v){try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v);}catch(e){return '';}}
function msg(t){el('msg').innerHTML=t||'';}
function pedir(acc,params,ok,mal){
 var q='accion='+acc+'&pin='+encodeURIComponent(PIN);
 for(var k in params)q+='&'+k+'='+encodeURIComponent(params[k]==null?'':params[k]);
 fetch(API+'?'+q,{credentials:'omit'}).then(function(r){return r.json();})
 .then(function(d){if(d&&d.error)mal({message:d.error});else ok(d);})
 .catch(function(){mal({message:'No pude conectar con Administración. Revisá la conexión y probá de nuevo.'});});}
function falla(e,dest){var m=String(e.message||e);
 if(m.indexOf('PIN:')>=0){pedirPin(m.replace(/^.*PIN:\s*/,''));return true;}
 if(dest)el(dest).innerHTML='<div class="err">⚠️ '+esc(m)+'</div>';else msg('<span class="err">⚠️ '+esc(m)+'</span>');return false;}
function pedirPin(m){el('volver').style.display='none';msg('');
 el('app').innerHTML='<div class="card" style="text-align:center"><h2>🔒 Oficina Gauss</h2><div style="margin-bottom:10px;color:'+(m.indexOf('Ingres')===0?'#555':'#c0392b')+'">'+esc(m)+'</div>'+
 '<input id="pin" type="password" placeholder="PIN" style="font-size:22px;width:180px;text-align:center"><br><button class="btn" style="width:auto;display:inline-block;padding:12px 34px" onclick="entrar()">Entrar</button></div>';
 var i=el('pin');i.focus();i.onkeydown=function(ev){if(ev.key==='Enter')entrar();};}
function entrar(){PIN=el('pin').value.trim();guardado('gaussPinSec',PIN);cargar();}

function cargar(){el('app').innerHTML='';msg('Cargando… (unos segundos)');
 pedir('lista',{},function(d){L=d;inicio();},function(e){falla(e);});}
cargar();

// ---------- INICIO: botones grandes ----------
function inicio(){el('volver').style.display='none';msg('');window.scrollTo(0,0);
 el('app').innerHTML='<div class="botones">'+
  '<button class="bgrande b1" onclick="inscribir()">📝 Inscribir alumno<small>Alumno nuevo o que vuelve: datos + grupo + cuota</small></button>'+
  '<a class="bgrande b2" href="'+PANEL_COBRO+'" target="_blank">💵 Cobrar<small>Buscar alumno, ver deuda y cargar pago</small></a>'+
  '<div class="bgrande bx">🔄 Cambiar de grupo<small>Próximamente</small></div>'+
  '<div class="bgrande bx">🩺 Justificativo<small>Próximamente</small></div>'+
  '</div>';}

// ---------- INSCRIBIR ----------
function inscribir(){el('volver').style.display='inline-block';EST={};window.scrollTo(0,0);
 el('app').innerHTML='<div class="card"><h2><span class="paso">1</span>¿Ya estuvo en Gauss?</h2>'+
  '<input id="bq" placeholder="Escribí apellido, nombre o ID para buscar…" oninput="buscar()" autocomplete="off">'+
  '<div id="bres" class="res"></div>'+
  '<button class="btn az" onclick="formulario(null)">➕ Es un alumno nuevo</button></div><div id="form"></div>';
 el('bq').focus();
 if(!FORM){msg('Cargando el formulario…');pedir('formInscripcion',{},function(d){FORM=d;msg('');},function(e){falla(e);});}}
function buscar(){var q=sa(el('bq').value.trim()),r=el('bres');
 if(!L||q.length<2){r.innerHTML='';return;}
 var p=q.split(/\s+/),h=L.alumnos.filter(function(x){var t=sa(x[0]+' '+x[1]);return p.every(function(w){return t.indexOf(w)>=0;});}).slice(0,8);
 r.innerHTML=h.length?h.map(function(x){return '<div><span>'+esc(x[1])+'<br><small>'+esc(x[0])+' · '+esc(x[2]||'sin grupo')+' · '+esc(x[3]||'')+'</small></span>'+
  '<button class="mini" onclick="formulario(\''+esc(x[0])+'\')">Inscribir a este</button></div>';}).join(''):'<div class="ayuda" style="border:0">No aparece: es un alumno nuevo.</div>';}

function campoHtml(c){var id='al'+c.j,lab='<label>'+esc(c.titulo)+(c.req?' <span class="req">*</span>':'')+'</label>';
 if(c.tipo==='check')return '<label style="font-weight:normal;margin-top:14px"><input type="checkbox" id="'+id+'">'+esc(c.titulo)+'</label>';
 if(c.tipo==='list')return lab+'<select id="'+id+'"><option value=""></option>'+c.ops.map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>';
 if(c.tipo==='date')return lab+'<input type="date" id="'+id+'">';
 if(c.tipo==='number')return lab+'<input id="'+id+'" inputmode="numeric" oninput="fmt(this)">';
 var extra=/APELLIDO|NOMBRE/i.test(c.titulo)?' oninput="parecidos()" autocomplete="off"':(/CEL|TEL/i.test(c.titulo)?' inputmode="tel"':'');
 return lab+'<input id="'+id+'"'+extra+'>';}

function formulario(idExistente){
 if(!FORM){msg('Cargando el formulario… esperá un segundo y tocá de nuevo.');return;}
 EST={id:idExistente};var h='';
 if(idExistente){var a=L.alumnos.filter(function(x){return x[0]===idExistente;})[0];
  h+='<div class="card"><h2><span class="paso">2</span>Alumno</h2><b>'+esc(a?a[1]:idExistente)+'</b><div class="ayuda">'+esc(idExistente)+' · ya está en la lista de alumnos (no se vuelven a cargar sus datos).</div></div>';}
 else{
  var obl=FORM.campos.filter(function(c){return c.req;}),otros=FORM.campos.filter(function(c){return !c.req;});
  h+='<div class="card"><h2><span class="paso">2</span>Datos del alumno nuevo</h2>'+
   '<div class="fila">'+obl.map(function(c){return '<div>'+campoHtml(c)+'</div>';}).join('')+'</div><div id="parec"></div>'+
   otros.map(function(c,i){var t=/^(RUC|RAZ)/i.test(c.titulo)&&!(i>0&&/^(RUC|RAZ)/i.test(otros[i-1].titulo))?
    '<div style="margin-top:18px;padding-top:10px;border-top:1px solid #ddd;font-weight:bold;color:#1f4e79">🧾 Datos de facturación <span class="ayuda">(opcional, solo si pide factura)</span></div>':'';return t+campoHtml(c);}).join('')+'<div class="ayuda" style="margin-top:8px">El ID se pone solo. Los nombres se guardan sin acentos y con mayúscula inicial.</div></div>';}
 // inscripción
 var mods={};FORM.grupos.forEach(function(g){(mods[g.mod||'Otros']=mods[g.mod||'Otros']||[]).push(g);});
 h+='<div class="card"><h2><span class="paso">3</span>Inscripción</h2>'+
  '<label>Grupo <span class="req">*</span></label><select id="gr" onchange="cambioGrupo()"><option value=""></option>'+
  Object.keys(mods).map(function(m){return '<optgroup label="'+esc(m)+'">'+mods[m].map(function(g){return '<option value="'+esc(g.cod)+'">'+esc(g.nombre)+(g.inicio?' · empieza '+fecha(g.inicio):'')+'</option>';}).join('')+'</optgroup>';}).join('')+'</select>'+
  '<div class="fila"><div><label>Empieza el <span class="req">*</span></label><input type="date" id="ini"></div>'+
  '<div><label>Plan</label><select id="pl" onchange="cambioPlan()">'+FORM.planes.map(function(p){return '<option'+(/cuota/i.test(p)?' selected':'')+'>'+esc(p)+'</option>';}).join('')+'</select></div></div>'+
  '<div class="fila"><div><label id="lmo">Cuota mensual (Gs.) <span class="req">*</span></label><input id="mo" inputmode="numeric" oninput="fmt(this);EST.toco=true"><div id="smo" class="ayuda"></div></div>'+
  '<div><label>1er vencimiento <span class="ayuda">(vacío = automático)</span></label><input type="date" id="v1"></div></div>'+
  (FORM.becas.length?'<label>Beca <span class="ayuda">(opcional)</span></label><select id="be"><option value=""></option>'+FORM.becas.map(function(b){return '<option>'+esc(b)+'</option>';}).join('')+'</select>':'')+
  '<label>Observaciones <span class="ayuda">(opcional)</span></label><input id="ob">'+
  '<button class="btn" id="bg" onclick="guardar()">💾 Inscribir</button><div id="gm"></div></div>';
 el('form').innerHTML=h;
 var f=el('form');window.scrollTo(0,f.offsetTop-10);}

function parecidos(){var c=FORM.campos.filter(function(x){return x.req;});
 var t=c.map(function(x){return sa(el('al'+x.j).value.trim());}).join(' ').trim(),r=el('parec');
 if(t.length<4){r.innerHTML='';return;}
 var p=t.split(/\s+/).filter(function(w){return w.length>2;}),h=L.alumnos.filter(function(x){var s=sa(x[1]);return p.length&&p.every(function(w){return s.indexOf(w)>=0;});}).slice(0,4);
 r.innerHTML=h.length?'<div class="aviso">⚠️ ¿Ya existe? '+h.map(function(x){return '<br><b>'+esc(x[1])+'</b> ('+esc(x[0])+' · '+esc(x[2]||'sin grupo')+') <button class="mini" onclick="formulario(\''+esc(x[0])+'\')">Es este</button>';}).join('')+'</div>':'';}

function grupoSel(){var c=el('gr').value;return FORM.grupos.filter(function(g){return g.cod===c;})[0];}
function cambioGrupo(){var g=grupoSel();if(!g)return;
 el('ini').value=g.inicio&&g.inicio>FORM.hoy?g.inicio:FORM.hoy;EST.toco=false;cambioPlan();}
function cambioPlan(){var g=grupoSel(),con=/contado|completo|unico|único/i.test(el('pl').value);
 el('lmo').innerHTML=(con?'Monto total (Gs.)':'Cuota mensual (Gs.)')+' <span class="req">*</span>';
 var def=g?(con?g.contado:g.cuota):null;
 if(!EST.toco)el('mo').value=def?Number(def).toLocaleString('es-PY'):'';
 el('smo').textContent=def?'Del grupo: '+gs(def)+'. Si tiene descuento o beca, cambialo.':'Este grupo no tiene '+(con?'PRECIO CONTADO':'CUOTA')+' cargado en GRUPOS: escribilo.';}

function guardar(forzar){var m=el('gm'),g=grupoSel(),datos={grupo:el('gr').value,inicio:el('ini').value,plan:el('pl').value,
  monto:num(el('mo').value),venc1:el('v1').value,beca:el('be')?el('be').value:'',obs:el('ob').value};
 var nombre='';
 if(EST.id)datos.idExistente=EST.id;
 else{datos.alumno={};var falta='';
  FORM.campos.forEach(function(c){var e=el('al'+c.j);if(!e)return;var v=c.tipo==='check'?e.checked:(c.tipo==='number'?(num(e.value)||''):e.value.trim());
   if(c.req&&!v)falta=falta||c.titulo;if(v!==''&&v!==false)datos.alumno[c.j]=v;});
  if(falta){m.innerHTML='<div class="err">Falta: '+esc(falta)+'</div>';return;}
  nombre=FORM.campos.filter(function(c){return c.req;}).map(function(c){return el('al'+c.j).value.trim();}).join(', ');}
 if(!g){m.innerHTML='<div class="err">Elegí el grupo.</div>';return;}
 if(!datos.inicio){m.innerHTML='<div class="err">Falta la fecha en que empieza.</div>';return;}
 if(!datos.monto&&!datos.beca){m.innerHTML='<div class="err">Falta el monto.</div>';return;}
 if(!forzar){var a=EST.id?L.alumnos.filter(function(x){return x[0]===EST.id;})[0]:null;
  if(!confirm('¿Inscribir a '+(a?a[1]:nombre)+'?\n\nGrupo: '+g.nombre+'\nEmpieza: '+fecha(datos.inicio)+'\n'+datos.plan+': '+gs(datos.monto)+(datos.beca?'\nBeca: '+datos.beca:'')))return;}
 var b=el('bg');b.disabled=true;b.textContent='Guardando…';m.innerHTML='';
 pedir('inscribir',{datos:JSON.stringify(datos),forzar:forzar?'1':'',nonce:Date.now()+'-'+Math.random().toString(36).slice(2)},listo,
  function(e){b.disabled=false;b.textContent='💾 Inscribir';var t=String(e.message||e);
   if(t.indexOf('REPETIDO:')===0){if(confirm(t.replace('REPETIDO: ','')+'\n\n¿Es otra persona con el mismo nombre? (Aceptar = cargar igual)'))guardar(true);return;}
   falla(e,'gm');});}

function listo(r){window.scrollTo(0,0);el('volver').style.display='inline-block';
 if(L&&r.nuevo)L.alumnos.push([r.id,r.nombre,r.grupo,'Inscripto',0]);
 el('app').innerHTML='<div class="card ok"><b class="big">✅ '+esc(r.nombre)+' quedó inscripto</b>'+
  'Grupo: <b>'+esc(r.grupo)+'</b> · empieza el '+esc(r.inicio)+'<br>ID alumno: <b>'+esc(r.id)+'</b>'+(r.numInsc?' · Inscripción: <b>'+esc(r.numInsc)+'</b>':'')+
  (r.wa?'<a class="btn vd" href="'+esc(r.wa)+'" target="_blank" style="text-align:center;text-decoration:none">📲 Mandar el link del grupo por WhatsApp</a>':
   '<div class="aviso">No se puede mandar el link del grupo: '+(r.wa===''?'falta el celular del alumno o el LINK WHATSAPP del grupo en GRUPOS.':'')+'</div>')+
  '<a class="btn" href="'+PANEL_COBRO+'" target="_blank" style="text-align:center;text-decoration:none">💵 Cobrar (matrícula / primera cuota)</a>'+
  '<button class="btn az" onclick="inscribir()">📝 Inscribir a otro alumno</button>'+
  '<div class="ayuda" style="margin-top:10px">Las deudas y listas se actualizan solas en 1 minuto.</div></div>';}
</script></body></html>
